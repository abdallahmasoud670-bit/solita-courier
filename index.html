<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1C1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="سوليتا">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>سوليتا — المندوب</title>
<style>
  :root { --dark:#1C1C1A; --olive:#4A5140; --ivory:#F5F1E8; --terra:#A65F45; --line:#CFC5B3; --muted:#6B665C; --ok:#2E7D32; --warn:#B7791F; --bad:#B3261E; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--ivory); color:var(--dark); font:17px/1.5 -apple-system,"SF Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif; }
  body { min-height:100vh; padding-bottom:env(safe-area-inset-bottom); }
  header { background:var(--dark); color:var(--ivory); padding:calc(10px + env(safe-area-inset-top)) 16px 10px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  header .brand { font-weight:800; font-size:20px; letter-spacing:.5px; }
  header .who { margin-inline-start:auto; font-size:14px; text-align:left; }
  header .badge { background:var(--terra); color:#fff; border-radius:6px; padding:1px 7px; font-size:12px; margin-inline-start:6px; }
  main { padding:16px; max-width:560px; margin:0 auto; }
  h1 { font-size:22px; margin:6px 0 14px; }
  h2 { font-size:18px; margin:18px 0 8px; }
  .btn { display:block; width:100%; min-height:56px; border:0; border-radius:14px; font:inherit; font-weight:700; font-size:19px; background:var(--olive); color:var(--ivory); padding:12px 16px; margin:10px 0; cursor:pointer; text-align:center; text-decoration:none; }
  .btn:active { transform:scale(.98); opacity:.9; }
  .btn.big { min-height:84px; font-size:22px; }
  .btn.terra { background:var(--terra); }
  .btn.dark { background:var(--dark); }
  .btn.ghost { background:transparent; color:var(--dark); border:2px solid var(--line); }
  .btn[disabled] { opacity:.45; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  input.field { width:100%; min-height:58px; font:inherit; font-size:22px; padding:10px 14px; border:2px solid var(--line); border-radius:14px; background:#fffdf8; text-align:center; direction:ltr; }
  input.field:focus { outline:none; border-color:var(--olive); }
  .card { background:#fffdf8; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:10px 0; }
  .card .top { display:flex; align-items:center; gap:8px; }
  .card .num { font-weight:800; font-size:20px; }
  .card .amt { margin-inline-start:auto; font-weight:800; }
  .muted { color:var(--muted); font-size:15px; }
  .err { color:var(--bad); font-weight:700; min-height:1.5em; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { border-radius:10px; padding:6px 12px; font-weight:700; background:#e9e3d6; color:var(--muted); font-size:15px; }
  .chip.on { background:var(--olive); color:var(--ivory); }
  .chip.unv { background:var(--warn); color:#fff; }
  .tag { font-size:13px; font-weight:700; border-radius:6px; padding:1px 8px; }
  .tag.ok { background:#dfeee0; color:var(--ok); }
  .tag.miss { background:#fbe3e1; color:var(--bad); }
  .tag.unv { background:#fbeed6; color:var(--warn); }
  .x { border:0; background:transparent; font-size:22px; color:var(--muted); min-width:44px; min-height:44px; cursor:pointer; }
  #reader { width:100%; border-radius:14px; overflow:hidden; background:#000; min-height:260px; }
  #reader video { border-radius:14px; }
  .sticky { position:sticky; bottom:0; background:linear-gradient(transparent, var(--ivory) 30%); padding:14px 0 calc(8px + env(safe-area-inset-bottom)); }
  .qbar { background:var(--warn); color:#fff; text-align:center; padding:8px; font-weight:700; }
  .banner { background:#fbe3e1; color:var(--bad); border-radius:12px; padding:10px 12px; font-weight:700; margin:10px 0; }
  .banner.okb { background:#dfeee0; color:var(--ok); }
  .summary { font-size:20px; font-weight:800; line-height:1.7; background:var(--olive); color:var(--ivory); border-radius:14px; padding:16px; text-align:center; }
  footer { text-align:center; color:var(--muted); font-size:13px; padding:18px 0 26px; }
  /* full-screen flash (iPhone has no vibration) */
  #flash { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; padding:24px; text-align:center; color:#fff; font-size:28px; font-weight:800; pointer-events:none; }
  #flash.show { display:flex; animation:pulse .25s ease-out 2 alternate; }
  #flash.ok { background:rgba(46,125,50,.93); } #flash.info { background:rgba(183,121,31,.95); } #flash.bad { background:rgba(179,38,30,.97); pointer-events:auto; }
  #flash small { font-size:19px; font-weight:600; margin-top:10px; }
  #flash .btn { max-width:320px; background:#fff; color:var(--bad); margin-top:24px; }
  @keyframes pulse { from { opacity:.55 } to { opacity:1 } }
  .modal { position:fixed; inset:0; z-index:40; background:rgba(28,28,26,.6); display:flex; align-items:flex-end; }
  .modal .sheet { background:var(--ivory); width:100%; max-width:560px; margin:0 auto; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .bagpick { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:12px 0; }
  .bagpick button { min-height:64px; font:inherit; font-size:20px; font-weight:800; border-radius:14px; border:2px solid var(--line); background:#fffdf8; }
  .bagpick button.on { background:var(--olive); color:var(--ivory); border-color:var(--olive); }
  .bagpick button[disabled] { opacity:.5; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <span class="brand">SOLITA · سوليتا</span>
  <span class="who" id="who"></span>
</header>
<div id="qbar" class="qbar hidden"></div>
<main id="app"></main>
<footer>الإصدار <b id="ver"></b> · <span id="net"></span></footer>
<div id="flash"></div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
'use strict';
const VERSION = '1.0.0';
const EXEC = 'https://script.google.com/macros/s/AKfycbwQpeRNIZcJqbScldWADntOBWfO3SmD4j-5GZx0fJeKkiSlVyKjObt24UFFRYxpnvuwWg/exec';
const PRINT_URL = EXEC + '?p=print';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n || 0).toLocaleString('en-US');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let S = store.get('sol_app', null);            // {token, user:{code,name,admin}}
let pick = store.get('sol_pick', null);        // current pickup session {orders:{id:{card,total,bags:[code],unv:[code]}}}
let queue = store.get('sol_queue', []);        // offline queue [{qid, api, body, at, label}]
let notes = store.get('sol_notes', []);        // results of queued sends, shown on home
let scanner = null, audio = null, busy = false, lastText = '', lastAt = 0;

// ───────── server ─────────
async function api(action, body, timeoutMs) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), timeoutMs || 25000);
  try {
    const r = await fetch(EXEC, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({api: action, token: S && S.token}, body || {})), signal: ctl.signal});
    const j = await r.json();
    if (j && j.auth === false && action !== 'login') { logout(true); }
    return j;
  } catch (e) {
    return {ok: false, offline: true, error: 'لا يوجد اتصال بالإنترنت'};
  } finally { clearTimeout(t); }
}
const qid = () => Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);

// ───────── offline queue ─────────
function saveQueue() { store.set('sol_queue', queue); renderQbar(); }
function renderQbar() {
  const b = $('qbar');
  b.textContent = 'في انتظار الإرسال (' + queue.length + ')';
  b.classList.toggle('hidden', !queue.length);
}
let flushing = false;
async function flushQueue() {
  if (flushing || !queue.length || !S) return;
  flushing = true;
  try {
    while (queue.length) {
      const it = queue[0];
      const r = await api(it.api, Object.assign({qid: it.qid}, it.body));
      if (r.offline) break;
      if (r.auth === false) break;
      queue.shift(); saveQueue();
      notes.unshift({at: Date.now(), label: it.label, r}); notes = notes.slice(0, 5); store.set('sol_notes', notes);
    }
  } finally { flushing = false; }
  if (current === 'home') showHome();
}
window.addEventListener('online', () => { setNet(); flushQueue(); });
window.addEventListener('offline', setNet);
setInterval(flushQueue, 30000);
function setNet() { $('net').textContent = navigator.onLine ? 'متصل' : 'غير متصل'; }

// ───────── feedback: sound + flash (+ vibration where supported) ─────────
function unlockAudio() {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state !== 'running') audio.resume(); } catch (e) {}
}
function tone(seq) {
  if (!audio) return;
  let t = audio.currentTime + 0.01;
  seq.forEach(([f, d, type]) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + d + 0.02);
    t += d + 0.06;
  });
}
const SND = {
  ok: () => tone([[1320, 0.12]]),
  info: () => tone([[660, 0.12], [660, 0.12]]),
  bad: () => tone([[200, 0.28, 'square'], [160, 0.28, 'square'], [200, 0.4, 'square']])
};
let flashTimer = null;
function flash(kind, title, sub) {
  const f = $('flash');
  clearTimeout(flashTimer);
  f.className = kind + ' show';
  f.innerHTML = '<div>' + esc(title) + '</div>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + (kind === 'bad' ? '<button class="btn" id="flashOk">حسنًا</button>' : '');
  (SND[kind] || SND.info)();
  try { navigator.vibrate && navigator.vibrate(kind === 'bad' ? [300, 120, 300, 120, 300] : kind === 'ok' ? 80 : [80, 80, 80]); } catch (e) {}
  if (kind === 'bad') { busy = true; $('flashOk').onclick = () => { f.className = ''; busy = false; lastText = ''; }; }
  else flashTimer = setTimeout(() => { f.className = ''; }, kind === 'ok' ? 900 : 1600);
}

// ───────── screens ─────────
let current = '';
function view(name, html) {
  if (current === 'pickup' && name !== 'pickup') stopCamera();
  current = name; $('app').innerHTML = html; window.scrollTo(0, 0);
  $('who').innerHTML = S ? esc(S.user.name) + (S.user.admin ? '<span class="badge">مدير</span>' : '') : '';
}

function showLogin(msg) {
  view('login', `
    <h1>تسجيل الدخول</h1>
    <p class="muted">أدخل رمزك الشخصي. سيتذكّر الجهاز دخولك، فلا تشارك رمزك مع أحد.</p>
    <input id="pin" class="field" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="8" placeholder="••••••">
    <div class="err" id="lerr">${esc(msg || '')}</div>
    <button class="btn big" id="lbtn">دخول</button>`);
  const go = async () => {
    const pin = $('pin').value.trim();
    if (!/^\d{4,8}$/.test(pin)) { $('lerr').textContent = 'أدخل الرمز المكوّن من أرقام فقط'; return; }
    $('lbtn').disabled = true; $('lerr').textContent = '';
    const r = await api('login', {pin});
    $('lbtn').disabled = false;
    if (!r.ok) { $('lerr').textContent = r.error || 'تعذّر الدخول'; return; }
    S = {token: r.token, user: r.user}; store.set('sol_app', S);
    showHome(); flushQueue();
  };
  $('lbtn').onclick = go;
  $('pin').onkeydown = e => { if (e.key === 'Enter') go(); };
  setTimeout(() => $('pin').focus(), 50);
}

function logout(expired) {
  const tok = S && S.token;
  S = null; store.set('sol_app', null);
  if (tok && !expired) fetch(EXEC, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({api: 'logout', token: tok})}).catch(() => {});
  showLogin(expired ? 'انتهت الجلسة، سجّل الدخول مرة أخرى' : '');
}

function noteHtml(n) {
  const r = n.r;
  if (!r.ok) return `<div class="banner">${esc(n.label)}: ${esc(r.error || 'تعذّر الإرسال')}</div>`;
  let h = `<div class="banner okb">${esc(n.label)} — تم الإرسال: استلمت ${r.sum.orders} طلبًا = ${r.sum.bags} طردًا، المطلوب تحصيله ${money(r.sum.amount)} جنيهًا</div>`;
  (r.rejected || []).forEach(x => { h += `<div class="banner">الطلب ${esc(x.order)}: ${esc(x.error)}</div>`; });
  return h;
}

function showHome() {
  const n = pick ? Object.keys(pick.orders).length : 0;
  view('home', `
    ${notes.map(noteHtml).join('')}
    ${notes.length ? '<button class="btn ghost" id="clr">إخفاء الإشعارات</button>' : ''}
    <button class="btn big" id="bPick">استلام طلبات${n ? ' (جارٍ: ' + n + ')' : ''}</button>
    <button class="btn big dark" id="bMine">طلباتي</button>
    ${S.user.admin ? `<h2>وظائف المدير</h2><a class="btn terra" href="${PRINT_URL}" target="_blank" rel="noopener">طباعة البوالص</a>` : ''}
    <button class="btn ghost" id="bOut">تسجيل الخروج</button>`);
  $('bPick').onclick = () => { unlockAudio(); showPickup(); };
  $('bMine').onclick = showMine;
  $('bOut').onclick = () => { if (confirm('هل تريد تسجيل الخروج من هذا الجهاز؟')) logout(false); };
  if ($('clr')) $('clr').onclick = () => { notes = []; store.set('sol_notes', notes); showHome(); };
}

async function showMine() {
  view('mine', `<h1>طلباتي</h1><div id="mlist" class="muted">جارٍ التحميل…</div><button class="btn ghost" id="back">رجوع</button>`);
  $('back').onclick = showHome;
  const r = await api('myOrders');
  if (current !== 'mine') return;
  if (!r.ok) { $('mlist').innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  $('mlist').innerHTML = !r.orders.length ? '<p>لا توجد طلبات معك الآن.</p>' :
    `<div class="summary">معك ${r.orders.length} طلبًا، المطلوب تحصيله ${money(r.amount)} جنيهًا</div>` +
    r.orders.map(o => `<div class="card"><div class="top"><span class="num">#${esc(o.order)}</span><span class="tag ok">${esc(o.status)}</span><span class="amt">${o.prepaid ? 'مدفوع مسبقًا' : money(o.amount) + ' ج'}</span></div>
      <div>${esc(o.customer)}</div><div class="muted">${esc(o.city)}${o.area ? ' — ' + esc(o.area) : ''} · ${o.bags} طرود</div></div>`).join('');
}

// ───────── pickup ─────────
function savePick() { store.set('sol_pick', pick); }
function pickTotals() {
  let orders = 0, bags = 0, amount = 0; const incomplete = [], unverified = [];
  Object.keys(pick.orders).forEach(id => {
    const o = pick.orders[id];
    if (o.unv.length) unverified.push(id);
    if (o.bags.length + o.unv.length < o.total) { incomplete.push(id); return; }
    orders++; bags += o.bags.length + o.unv.length; amount += o.card ? o.card.amount : 0;
  });
  return {orders, bags, amount, incomplete, unverified};
}

function showPickup() {
  pick = pick || {orders: {}}; savePick();
  view('pickup', `
    <h1>استلام طلبات</h1>
    <div id="reader"></div>
    <div class="err" id="camerr"></div>
    <div class="row"><input id="man" class="field" inputmode="numeric" pattern="[0-9]*" placeholder="رقم الطلب"><button class="btn" id="manBtn" style="max-width:130px">إضافة</button></div>
    <div id="plist"></div>
    <div class="sticky"><button class="btn big terra" id="pDone">إنهاء ومراجعة</button><button class="btn ghost" id="pBack">رجوع</button></div>`);
  $('manBtn').onclick = manualAdd;
  $('man').onkeydown = e => { if (e.key === 'Enter') manualAdd(); };
  $('pDone').onclick = showSummary;
  $('pBack').onclick = showHome;
  renderPick();
  startCamera();
}

function renderPick() {
  const el = $('plist'); if (!el) return;
  const ids = Object.keys(pick.orders);
  if (!ids.length) { el.innerHTML = '<p class="muted">وجّه الكاميرا إلى رمز QR على كل طرد. يمكنك مسح الطرود واحدًا تلو الآخر دون توقف.</p>'; return; }
  el.innerHTML = ids.slice().reverse().map(id => {
    const o = pick.orders[id], c = o.card || {}, got = o.bags.length + o.unv.length;
    const chips = [];
    for (let n = 1; n <= o.total; n++) {
      const code = `SOL:${id}-${n}/${o.total}`;
      chips.push(`<span class="chip ${o.bags.includes(code) ? 'on' : o.unv.includes(code) ? 'unv' : ''}">${n} من ${o.total}</span>`);
    }
    const tag = got < o.total ? `<span class="tag miss">ناقص ${o.total - got}</span>` : o.unv.length ? '<span class="tag unv">لم يُتحقق بعد</span>' : '<span class="tag ok">مكتمل</span>';
    return `<div class="card"><div class="top"><span class="num">#${esc(id)}</span>${tag}<span class="amt">${c.prepaid ? 'مدفوع مسبقًا' : c.amount != null ? money(c.amount) + ' ج' : ''}</span><button class="x" data-rm="${esc(id)}" aria-label="حذف">×</button></div>
      ${c.customer ? `<div>${esc(c.customer)}</div><div class="muted">${esc(c.city)}${c.area ? ' — ' + esc(c.area) : ''}</div>` : '<div class="muted">سيُتحقق من الطلب عند عودة الاتصال</div>'}
      <div class="chips">${chips.join('')}</div></div>`;
  }).join('');
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    if (!confirm('حذف الطلب ' + b.dataset.rm + ' من قائمة الاستلام؟')) return;
    delete pick.orders[b.dataset.rm]; savePick(); renderPick();
  });
}

function startCamera() {
  if (typeof Html5Qrcode === 'undefined') { $('camerr').textContent = 'تعذّر تحميل قارئ الرموز — استخدم إدخال رقم الطلب يدويًا'; return; }
  try {
    scanner = new Html5Qrcode('reader', {verbose: false, formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], experimentalFeatures: {useBarCodeDetectorIfSupported: true}});
    scanner.start({facingMode: 'environment'}, {fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.75); return {width: s, height: s}; }}, onScan, () => {})
      .catch(e => { $('camerr').textContent = 'لا يمكن فتح الكاميرا: اسمح للمتصفح باستخدامها ثم أعد المحاولة، أو أدخل رقم الطلب يدويًا. (' + (e && e.name || e) + ')'; });
  } catch (e) { $('camerr').textContent = 'لا يمكن فتح الكاميرا (' + e + ')'; }
}
function stopCamera() {
  const s = scanner; scanner = null;
  if (s) { try { s.stop().then(() => s.clear()).catch(() => {}); } catch (e) {} }
}

function onScan(text) {
  const now = Date.now();
  text = String(text || '').trim();
  if (busy) return;
  if (text === lastText && now - lastAt < 2500) return; // the camera keeps reading the same label
  lastText = text; lastAt = now;
  handleCode(text);
}

async function handleCode(text) {
  const m = text.match(/^SOL:(\d{1,10})-(\d{1,2})\/(\d{1,2})$/i);
  if (!m || +m[2] < 1 || +m[2] > +m[3]) return flash('bad', 'هذا ليس رمز بوليصة سوليتا', 'امسح رمز QR الموجود على البوليصة أو أدخل رقم الطلب');
  const id = m[1], total = +m[3], code = `SOL:${id}-${+m[2]}/${total}`, o = pick.orders[id];
  if (o && (o.bags.includes(code) || o.unv.includes(code))) return flash('info', 'مسحت هذا الطرد من قبل', `الطلب ${id} — الطرد ${+m[2]} من ${total}`);
  busy = true;
  const r = await api('pickupScan', {code});
  busy = false;
  if (current !== 'pickup') return;
  if (r.offline) {
    const x = pick.orders[id] = pick.orders[id] || {card: null, total, bags: [], unv: []};
    if (x.total !== total) return flash('bad', 'هذا الطرد لا يطابق طرود الطلب نفسه', 'عدد الطرود مختلف في البوليصتين');
    x.unv.push(code); savePick(); renderPick();
    return flash('info', `طرد ${+m[2]} من ${total} — الطلب ${id}`, 'لا يوجد اتصال: سيُتحقق منه عند الإرسال');
  }
  if (!r.ok) return flash('bad', r.error || 'حدث خطأ');
  if (r.kind === 'block') return flash('bad', r.msg, 'الطلب ' + id);
  if (r.kind === 'mine') return flash('info', r.msg, 'الطلب ' + id);
  addBags(r.order, [code]);
  const x = pick.orders[id], got = x.bags.length + x.unv.length;
  flash('ok', `طرد ${+m[2]} من ${total} — الطلب ${id}`, got < x.total ? `هذا الطلب ${x.total} طرود، مسحت ${got} فقط` : 'اكتمل الطلب ✓');
}

function addBags(card, codes) {
  const id = card.order, x = pick.orders[id] = pick.orders[id] || {card, total: card.bags, bags: [], unv: []};
  x.card = card; x.total = card.bags;
  codes.forEach(c => { x.unv = x.unv.filter(k => k !== c); if (!x.bags.includes(c)) x.bags.push(c); });
  savePick(); renderPick();
}

async function manualAdd() {
  unlockAudio();
  const v = $('man').value.replace(/\D/g, '');
  if (!v) return;
  $('manBtn').disabled = true;
  const r = await api('pickupScan', {code: v});
  $('manBtn').disabled = false;
  if (r.offline) return flash('bad', 'إدخال رقم الطلب يدويًا يحتاج اتصالًا بالإنترنت', 'امسح رمز QR بدلًا من ذلك');
  if (!r.ok) return flash('bad', r.error || 'حدث خطأ');
  if (r.kind === 'block') return flash('bad', r.msg, 'الطلب ' + v);
  if (r.kind === 'mine') return flash('info', r.msg, 'الطلب ' + v);
  $('man').value = '';
  pickBags(r.order);
}

// manual entry: the courier ticks each bag he actually holds (so the missing-bag check still works)
function pickBags(card) {
  const have = (pick.orders[card.order] || {bags: []}).bags, sel = new Set();
  let btns = '';
  for (let n = 1; n <= card.bags; n++) {
    const code = `SOL:${card.order}-${n}/${card.bags}`;
    btns += `<button data-c="${code}" class="${have.includes(code) ? 'on' : ''}" ${have.includes(code) ? 'disabled' : ''}>${n} من ${card.bags}</button>`;
  }
  $('sheet').innerHTML = `<h2>الطلب #${esc(card.order)} — ${esc(card.customer)}</h2>
    <p class="muted">هذا الطلب ${card.bags} طرود. اضغط على كل طرد موجود في يدك الآن.</p>
    <div class="bagpick">${btns}</div>
    <button class="btn" id="bpOk">إضافة الطرود المحددة</button><button class="btn ghost" id="bpNo">إلغاء</button>`;
  $('modal').classList.remove('hidden');
  $('sheet').querySelectorAll('.bagpick button:not([disabled])').forEach(b => b.onclick = () => { b.classList.toggle('on'); b.classList.contains('on') ? sel.add(b.dataset.c) : sel.delete(b.dataset.c); });
  $('bpNo').onclick = () => $('modal').classList.add('hidden');
  $('bpOk').onclick = () => {
    if (!sel.size) return;
    $('modal').classList.add('hidden');
    addBags(card, [...sel]);
    const x = pick.orders[card.order], got = x.bags.length;
    flash(got < x.total ? 'info' : 'ok', `الطلب ${card.order}: ${got} من ${x.total}`, got < x.total ? `هذا الطلب ${x.total} طرود، مسحت ${got} فقط` : 'اكتمل الطلب ✓');
  };
}

function showSummary() {
  const t = pickTotals();
  if (!Object.keys(pick.orders).length) return flash('info', 'لم تمسح أي طرد بعد');
  view('summary', `
    <h1>مراجعة الاستلام</h1>
    ${t.incomplete.map(id => { const o = pick.orders[id], g = o.bags.length + o.unv.length; return `<div class="banner">الطلب ${esc(id)}: هذا الطلب ${o.total} طرود، مسحت ${g} فقط — لن يُستلم حتى تمسح باقي الطرود</div>`; }).join('')}
    ${t.unverified.length ? `<div class="banner" style="background:#fbeed6;color:var(--warn)">طرود لم يُتحقق منها بعد (بلا اتصال): الطلب ${t.unverified.map(esc).join('، ')}. سيتحقق الخادم منها عند الإرسال.</div>` : ''}
    <div class="summary">استلمت ${t.orders} طلبًا = ${t.bags} طردًا،<br>المطلوب تحصيله ${money(t.amount)} جنيهًا${t.unverified.length ? '<br><small>(بدون مبالغ الطلبات غير المتحقَّق منها)</small>' : ''}</div>
    <button class="btn big" id="sOk" ${t.orders ? '' : 'disabled'}>تأكيد الاستلام</button>
    <button class="btn ghost" id="sBack">متابعة المسح</button>`);
  $('sBack').onclick = showPickup;
  $('sOk').onclick = confirmPickup;
}

async function confirmPickup() {
  const t = pickTotals(), ids = Object.keys(pick.orders).filter(id => !t.incomplete.includes(id));
  const bags = []; ids.forEach(id => bags.push(...pick.orders[id].bags, ...pick.orders[id].unv));
  const item = {qid: qid(), api: 'pickupConfirm', body: {bags}, at: Date.now(), label: 'استلام ' + ids.length + ' طلبًا'};
  $('sOk').disabled = true; $('sOk').textContent = 'جارٍ الإرسال…';
  const r = await api(item.api, Object.assign({qid: item.qid}, item.body), 45000);
  const clearDone = () => { ids.forEach(id => delete pick.orders[id]); if (!Object.keys(pick.orders).length) pick = null; savePick(); };
  if (r.offline) {
    clearDone();
    queue.push(item); saveQueue();
    view('done', `<div class="banner" style="background:#fbeed6;color:var(--warn)">لا يوجد اتصال الآن. حُفظ الاستلام في الجهاز وسيُرسل تلقائيًا عند عودة الاتصال — لا تغلق التطبيق نهائيًا حتى يختفي «في انتظار الإرسال».</div><button class="btn big" id="dHome">الرئيسية</button>`);
    $('dHome').onclick = showHome; return;
  }
  if (r.auth === false) return;
  if (!r.ok) {
    // the server refused the whole request → the scanned list stays for another try
    view('done', `<div class="banner">${esc(r.error || 'تعذّر التأكيد')}</div><button class="btn big" id="dHome">الرئيسية</button>`);
    $('dHome').onclick = showHome; return;
  }
  clearDone();
  flash(r.rejected.length ? 'info' : 'ok', r.rejected.length ? 'تم الاستلام مع ملاحظات' : 'تم الاستلام ✓');
  view('done', `
    <div class="summary">استلمت ${r.sum.orders} طلبًا = ${r.sum.bags} طردًا،<br>المطلوب تحصيله ${money(r.sum.amount)} جنيهًا</div>
    ${r.rejected.map(x => `<div class="banner">لم يُستلم الطلب ${esc(x.order)}: ${esc(x.error)}</div>`).join('')}
    ${r.accepted.map(o => `<div class="card"><div class="top"><span class="num">#${esc(o.order)}</span><span class="tag ok">${o.already ? 'كان معك بالفعل' : 'مع المندوب'}</span><span class="amt">${o.prepaid ? 'مدفوع مسبقًا' : money(o.amount) + ' ج'}</span></div><div>${esc(o.customer)}</div><div class="muted">${esc(o.city)}${o.area ? ' — ' + esc(o.area) : ''} · ${o.bags} طرود</div></div>`).join('')}
    <button class="btn big" id="dHome">الرئيسية</button>`);
  $('dHome').onclick = showHome;
}

// ───────── start ─────────
$('ver').textContent = VERSION; setNet(); renderQbar();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=' + VERSION).catch(() => {});
if (!S) showLogin();
else {
  showHome(); flushQueue();
  api('me').then(r => { if (r.ok) { S.user = r.user; store.set('sol_app', S); if (current === 'home') showHome(); } });
}
</script>
</body>
</html>
